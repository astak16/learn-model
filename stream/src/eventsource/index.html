<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>SSE 流式 Demo</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 16px;
      }
      button {
        padding: 8px 16px;
        margin-right: 8px;
        cursor: pointer;
      }
      #out {
        white-space: pre-wrap;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        min-height: 120px;
        margin-top: 16px;
        background: #fafafa;
      }
      #status {
        color: #888;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h2>SSE 流式数据 Demo</h2>
    <button id="btn1">连接 /stream</button>
    <button id="btnStop">断开</button>
    <div id="status">未连接</div>
    <div id="out"></div>

    <script>
      /** @type {EventSource | null} */
      let es = null;
      /** @type {number} */
      let retryCount = 0;
      /** @type {boolean} */
      let stopped = false;
      /** @type {number} */
      const MAX_RETRY = 3;

      const out = /** @type {HTMLDivElement} */ (document.getElementById("out"));
      const status = /** @type {HTMLDivElement} */ (document.getElementById("status"));

      /**
       * @param {string} url
       * @returns {void}
       */
      function connect(url) {
        stopped = false;
        retryCount = 0;
        out.textContent = "";
        status.textContent = `连接中: ${url}`;

        // 直接 new EventSource，不做任何手动重连
        // 断线时浏览器会自动重连，并在请求头带上 Last-Event-ID（即最后收到的 id 字段值）
        // 后端读取 Last-Event-ID 就知道从哪里续传
        es = new EventSource(url);

        es.onopen = () => {
          if (retryCount === 0) {
            status.textContent = `已连接: ${url}`;
          } else {
            status.textContent = `第 ${retryCount} 次重连成功，自动续传 ✓`;
          }
        };

        // es.onmessage = (e) => {
        //   out.textContent += e.data;
        // };

        es.addEventListener("message", (/** @type {MessageEvent} */ e) => {
          out.textContent += e.data;
        });

        es.addEventListener("done", () => {
          es?.close();
          es = null;
          status.textContent = `流接收完成 ✓`;
        });

        es.onerror = () => {
          // 手动断开时 stopped=true，直接关掉不重连
          if (stopped) {
            es?.close();
            es = null;
            return;
          }

          // 达到重连上限时才关闭
          if (retryCount >= MAX_RETRY) {
            es?.close();
            es = null;
            status.textContent = `已重连 ${MAX_RETRY} 次，仍失败，放弃`;
            return;
          }

          // 其余情况：什么都不做，让浏览器自己重连
          // EventSource 内置重连会自动带上 Last-Event-ID header
          retryCount++;
          status.textContent = `连接断开，等待浏览器自动重连（第 ${retryCount} 次）...`;
        };
      }

      /** @type {HTMLButtonElement} */ (document.getElementById("btn1")).onclick = () => connect("/stream");

      /** @type {HTMLButtonElement} */ (document.getElementById("btnStop")).onclick = () => {
        stopped = true;
        if (es) {
          es.close();
          es = null;
        }
        status.textContent = "已手动断开";
      };
    </script>
  </body>
</html>
